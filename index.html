
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Lester Gwapo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <form id="registrationForm">
            <h2>Western Instute of Technology  </h2>
            <h2>Student Registration Form</h2>
            <h3>fill in this form to register</h3>
            
            <div class="form-group">
                <label for="firstName">First Name <span class="required">*</span></label>
                <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>
                <span class="error" id="firstNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="lastName">Last Name <span class="required">*</span></label>
                <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>
                <span class="error" id="lastNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="Enter your e-mail" required>
                <span class="error" id="emailError"></span>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth <span class="required">*</span></label>
                <input type="date" id="dob" name="dob" required>
                <span class="error" id="dobError"></span>
            </div>
            
            <div class="form-group">
                <label for="username">Set Username <span class="required">*</span></label>
                <input type="text" id="username" name="username" placeholder="Select a unique username" required>
                <span class="error" id="usernameError"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Set Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
                <span class="error" id="passwordError"></span>
            </div>
            
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    <input type="radio" id="others" name="gender" value="Others">
                    <label for="others">Others/Prefer Not to Say</label>
                </div>
                <span class="error" id="genderError"></span>
            </div>
            
            <div class="form-group">
                <label for="course">Select Academic Program <span class="required">*</span></label>
                <select id="course" name="course" required>
                    <option value="">Choose Your Program</option>
                    <option value="Computer Science">Bachelor of Science in Computer Science</option>
                    <option value="Software Engineering">Bachelor of Science in Software Engineering</option>
                    <option value="Cybersecurity">Bachelor of Information Technology</option>
                    <option value="Data Science">Bachelor of Science in Data Science</option>
                    <option value="Network Engineering">Bachelor of Science in Network Engineering</option>
                    <option value="Digital Media">Bachelor of Arts in Digital Media</option>
                   >
                </select>
                <span class="error" id="courseError"></span>
            </div>
            
          
            
            <button type="submit" class="register-btn">Complete Registration</button>
      
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
